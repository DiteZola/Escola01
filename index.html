<body>
<div id="app"></div>

<script>
// ==================== FIREBASE CONFIG ====================
const firebaseConfig = {
  apiKey: "AIzaSyDivpB49WezISoGxExglgJgfFit8IS9QDg",
  authDomain: "gestao-escolar-01.firebaseapp.com",
  projectId: "gestao-escolar-01",
  storageBucket: "gestao-escolar-01.firebasestorage.app",
  messagingSenderId: "622404754159",
  appId: "1:622404754159:web:69b6eff5e97ca19522591a"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ==================== DATABASE SYSTEM ====================
const DB = {
  data: {},
  isSyncing: false,
  initialized: false,
  unsubscribe: null,

  // Initialize data structure
  initData() {
    const defaults = {
      users: [], students: [], classes: [], turmas: [], turnos: [],
      disciplinas: [], notas: [], mensagens: [], presencas: [], eventos: [],
      horarios: [], matriculas: [], encarregados: [], documentos: [],
      trimestres: [], pautas: [], config: {}, anoLetivo: null, lastUpdate: 0,
      financeiro: { 
        entradas: [], 
        saidas: [], 
        patrimonio: [],
        categorias: ['Propinas', 'Matrículas', 'Multas', 'Outros'],
        categoriasSaida: ['Salários', 'Material', 'Manutenção', 'Serviços', 'Outros']
      }
    };
    Object.keys(defaults).forEach(key => {
      if (this.data[key] === undefined) this.data[key] = defaults[key];
    });
  },

  // Generate unique ID
  generateId() {
    return 'id_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
  },

  // Show sync indicator
  showStatus(type, msg) {
    let el = document.getElementById('syncStatus');
    if (!el) {
      el = document.createElement('div');
      el.id = 'syncStatus';
      el.style.cssText = 'position:fixed;bottom:20px;left:20px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;display:flex;align-items:center;gap:10px;box-shadow:0 4px 15px rgba(0,0,0,0.2);transition:all 0.3s;';
      document.body.appendChild(el);
    }
    
    const styles = {
      loading: { bg: '#3b82f6', icon: 'fa-sync fa-spin' },
      success: { bg: '#10b981', icon: 'fa-check-circle' },
      error: { bg: '#ef4444', icon: 'fa-exclamation-triangle' },
      offline: { bg: '#6b7280', icon: 'fa-cloud-slash' }
    };
    
    const s = styles[type] || styles.loading;
    el.style.background = s.bg;
    el.style.color = '#fff';
    el.innerHTML = `<i class="fas ${s.icon}"></i> <span>${msg}</span>`;
    el.style.display = 'flex';
    
    if (type === 'success') {
      setTimeout(() => { el.style.display = 'none'; }, 2500);
    }
  },

  // Load from localStorage
  loadLocal() {
    try {
      const saved = localStorage.getItem('nkalambata_v2');
      if (saved) {
        this.data = JSON.parse(saved);
        console.log('💾 Dados carregados do localStorage');
      }
    } catch (e) {
      console.error('Erro ao carregar dados locais:', e);
      this.data = {};
    }
    this.initData();
  },

  // Save to localStorage
  saveLocal() {
    try {
      this.data.lastUpdate = Date.now();
      localStorage.setItem('nkalambata_v2', JSON.stringify(this.data));
    } catch (e) {
      console.error('Erro ao salvar localmente:', e);
    }
  },

  // ===== FIREBASE OPERATIONS =====
  
  // Save to Firebase - SIMPLIFIED
  async saveToFirebase() {
    try {
      this.data.lastUpdate = Date.now();
      
      // Create a clean copy without circular references
      const dataStr = JSON.stringify(this.data);
      
      await db.collection('nkalambata').doc('mainData').set({
        jsonData: dataStr,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        version: this.data.lastUpdate
      });
      
      console.log('✅ Firebase: Dados salvos!', new Date().toLocaleTimeString());
      return true;
    } catch (error) {
      console.error('❌ Firebase: Erro ao salvar:', error);
      return false;
    }
  },

  // Load from Firebase - SIMPLIFIED
  async loadFromFirebase() {
    try {
      const docSnap = await db.collection('nkalambata').doc('mainData').get();
      
      if (docSnap.exists) {
        const docData = docSnap.data();
        if (docData.jsonData) {
          const remoteData = JSON.parse(docData.jsonData);
          const remoteVersion = docData.version || 0;
          const localVersion = this.data.lastUpdate || 0;
          
          console.log(`📊 Versões - Local: ${new Date(localVersion).toLocaleString()}, Servidor: ${new Date(remoteVersion).toLocaleString()}`);
          
          // ALWAYS use remote if it has users and local doesn't, OR if remote is newer
          if ((remoteData.users && remoteData.users.length > 0) && 
              (!this.data.users || this.data.users.length === 0 || remoteVersion > localVersion)) {
            console.log('📥 Carregando dados do servidor');
            this.data = remoteData;
            this.initData();
            this.saveLocal();
            return { loaded: true, hasData: true };
          }
          return { loaded: false, hasData: remoteData.users && remoteData.users.length > 0 };
        }
      }
      console.log('📭 Nenhum dado no Firebase');
      return { loaded: false, hasData: false };
    } catch (error) {
      console.error('❌ Firebase: Erro ao carregar:', error);
      return { loaded: false, hasData: false, error: error.message };
    }
  },

  // Start real-time listener
  startListener() {
    if (this.unsubscribe) return;
    
    console.log('👂 Iniciando listener...');
    
    this.unsubscribe = db.collection('nkalambata').doc('mainData')
      .onSnapshot((docSnap) => {
        if (!docSnap.exists || this.isSyncing) return;
        
        try {
          const docData = docSnap.data();
          const remoteVersion = docData.version || 0;
          const localVersion = this.data.lastUpdate || 0;
          
          if (remoteVersion > localVersion && docData.jsonData) {
            console.log('🔄 Actualizando dados em tempo real...');
            
            const remoteData = JSON.parse(docData.jsonData);
            const currentSession = typeof currentUser !== 'undefined' ? currentUser : null;
            
            this.data = remoteData;
            this.initData();
            this.saveLocal();
            
            // Restore session
            if (currentSession) {
              const stillValid = this.data.users.find(u => u.id === currentSession.id);
              if (stillValid) currentUser = stillValid;
            }
            
            if (typeof render === 'function') render();
            this.showStatus('success', 'Dados actualizados!');
          }
        } catch (e) {
          console.error('Erro no listener:', e);
        }
      });
  },

  stopListener() {
    if (this.unsubscribe) {
      this.unsubscribe();
      this.unsubscribe = null;
    }
  },

  // ===== MAIN SAVE FUNCTION =====
  async save() {
    if (this.isSyncing) {
      // Queue the save for later
      setTimeout(() => this.save(), 500);
      return;
    }
    
    this.isSyncing = true;
    this.saveLocal();
    
    if (navigator.onLine) {
      this.showStatus('loading', 'Guardando...');
      const success = await this.saveToFirebase();
      if (success) {
        this.showStatus('success', 'Guardado!');
      } else {
        this.showStatus('error', 'Erro ao guardar no servidor');
      }
    }
    
    this.isSyncing = false;
  },

  // Force sync
  async forceSync() {
    if (!navigator.onLine) {
      this.showStatus('offline', 'Sem internet');
      return false;
    }
    
    this.isSyncing = true;
    this.showStatus('loading', 'Sincronizando...');
    
    try {
      const result = await this.loadFromFirebase();
      
      if (!result.loaded && this.data.users && this.data.users.length > 0) {
        // Local has data, push to server
        await this.saveToFirebase();
      }
      
      this.showStatus('success', 'Sincronizado!');
      this.isSyncing = false;
      return true;
    } catch (e) {
      this.showStatus('error', 'Erro na sincronização');
      this.isSyncing = false;
      return false;
    }
  },

  // Initialize
  async init() {
    console.log('🚀 Iniciando Complexo Escolar Nkalambata...');
    
    // Load local first
    this.loadLocal();
    
    if (navigator.onLine) {
      this.showStatus('loading', 'Conectando...');
      
      try {
        const result = await this.loadFromFirebase();
        
        if (result.loaded) {
          this.showStatus('success', 'Dados carregados!');
          // Re-render if render function exists
          setTimeout(() => {
            if (typeof render === 'function') render();
          }, 100);
        } else if (result.hasData === false && this.data.users && this.data.users.length > 0) {
          // We have local data but server is empty - push to server
          await this.saveToFirebase();
          this.showStatus('success', 'Dados enviados ao servidor!');
        } else {
          this.showStatus('success', 'Conectado!');
        }
        
        // Start listener
        this.startListener();
      } catch (e) {
        console.error('Erro na inicialização:', e);
        this.showStatus('error', 'Erro ao conectar');
      }
    } else {
      this.showStatus('offline', 'Modo offline');
    }
    
    // Network listeners
    window.addEventListener('online', async () => {
      console.log('🌐 Online!');
      await this.forceSync();
      this.startListener();
      if (typeof render === 'function') render();
    });
    
    window.addEventListener('offline', () => {
      console.log('📴 Offline');
      this.showStatus('offline', 'Sem internet');
      this.stopListener();
    });
    
    this.initialized = true;
    console.log('✅ Sistema pronto!');
  }
};

// Start initialization
DB.init();

// ==================== APP STATE ====================
let currentUser = null;
let currentPage = 'dashboard';
let sidebarCollapsed = false;
let editingItem = null;

// ==================== UTILITY FUNCTIONS ====================
function showToast(msg, type = 'success') {
  const colors = { success: '#059669', error: '#dc2626', warning: '#d97706', info: '#2563eb' };
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.style.background = colors[type];
  toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'times-circle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle'}"></i> ${msg}`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

function formatDate(d) { if (!d) return '-'; return new Date(d).toLocaleDateString('pt-AO'); }
function generatePassword() { return Math.random().toString(36).substr(2, 8); }

function getInitials(name) {
  if (!name) return '?';
  return name.split(' ').map(n => n[0]).join('').substr(0, 2).toUpperCase();
}

function photoOrInitials(photo, name, size = '') {
  if (photo) return `<img src="${photo}" class="avatar ${size}" alt="">`;
  return `<div class="avatar ${size}">${getInitials(name)}</div>`;
}

function readFileAsDataURL(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.readAsDataURL(file);
  });
}

// ==================== EXPORT FUNCTIONS ====================
function exportToXLS(data, filename, headers) {
  const ws = XLSX.utils.json_to_sheet(data, { header: headers });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Dados');
  XLSX.writeFile(wb, filename + '.xlsx');
  showToast('Ficheiro Excel exportado com sucesso!');
}

function exportToPDF(title, headers, rows) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('l', 'mm', 'a4');
  doc.setFontSize(16);
  doc.text('Complexo Escolar Nkalambata', 14, 15);
  doc.setFontSize(12);
  doc.text(title, 14, 25);
  doc.setFontSize(8);
  doc.text(`Data: ${new Date().toLocaleDateString('pt-AO')}`, 14, 32);
  let y = 40;
  const colW = (280 - 28) / headers.length;
  doc.setFillColor(30, 58, 95);
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(8);
  headers.forEach((h, i) => {
    doc.rect(14 + i * colW, y, colW, 8, 'F');
    doc.text(h, 16 + i * colW, y + 5.5);
  });
  doc.setTextColor(0, 0, 0);
  y += 8;
  rows.forEach((row, ri) => {
    if (y > 190) { doc.addPage(); y = 20; }
    if (ri % 2 === 0) { doc.setFillColor(248, 250, 252); doc.rect(14, y, 280 - 28, 7, 'F'); }
    row.forEach((cell, ci) => {
      doc.text(String(cell || '-').substring(0, 30), 16 + ci * colW, y + 5);
    });
    y += 7;
  });
  doc.save(title.replace(/\s/g, '_') + '.pdf');
  showToast('PDF exportado com sucesso!');
}

function generateDocument(type, data) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(10);
  doc.text('REPUBLICA DE ANGOLA', 105, 15, { align: 'center' });
  doc.text('MINISTERIO DA EDUCACAO', 105, 20, { align: 'center' });
  doc.setFontSize(14);
  doc.setFont(undefined, 'bold');
  doc.text('COMPLEXO ESCOLAR NKALAMBATA', 105, 30, { align: 'center' });
  doc.setFont(undefined, 'normal');
  doc.line(20, 35, 190, 35);

  if (type === 'declaracao') {
    doc.setFontSize(16);
    doc.text('DECLARACAO', 105, 50, { align: 'center' });
    doc.setFontSize(11);
    const text = `A Direcao do Complexo Escolar Nkalambata, declara para os devidos efeitos que ${data.nome}, portador(a) do Bilhete de Identidade n.o ${data.bi || '___________'}, e aluno(a) desta instituicao de ensino, matriculado(a) na ${data.classe || '____'} classe, turma ${data.turma || '____'}, no ano lectivo de ${DB.data.anoLetivo?.nome || '____'}.`;
    const lines = doc.splitTextToSize(text, 160);
    doc.text(lines, 20, 65);
    doc.text(`Luanda, ${new Date().toLocaleDateString('pt-AO')}`, 20, 120);
    doc.text('_________________________________', 105, 145, { align: 'center' });
    doc.text('O(A) Director(a) Geral', 105, 152, { align: 'center' });
  } else if (type === 'certificado') {
    doc.setFontSize(16);
    doc.text('CERTIFICADO', 105, 50, { align: 'center' });
    doc.setFontSize(11);
    const text = `Certifica-se que ${data.nome}, nascido(a) em ${data.dataNascimento || '___/___/___'}, natural de ${data.naturalidade || '___________'}, provincia de ${data.provincia || '___________'}, concluiu com aproveitamento a ${data.classe || '____'} classe do Ensino ${data.nivel || 'Primario'}, no ano lectivo de ${DB.data.anoLetivo?.nome || '____'}, com a media final de ${data.media || '____'} valores.`;
    const lines = doc.splitTextToSize(text, 160);
    doc.text(lines, 20, 65);
    doc.text(`Luanda, ${new Date().toLocaleDateString('pt-AO')}`, 20, 130);
    doc.text('_________________________________', 105, 155, { align: 'center' });
    doc.text('O(A) Director(a) Geral', 105, 162, { align: 'center' });
  } else if (type === 'boletim') {
    doc.setFontSize(14);
    doc.text('BOLETIM DE NOTAS', 105, 50, { align: 'center' });
    doc.setFontSize(10);
    doc.text(`Aluno(a): ${data.nome}`, 20, 62);
    doc.text(`Classe: ${data.classe}  Turma: ${data.turma}`, 20, 69);
    doc.text(`Ano Lectivo: ${DB.data.anoLetivo?.nome || '-'}`, 20, 76);
    let y = 85;
    doc.setFillColor(30, 58, 95);
    doc.setTextColor(255, 255, 255);
    doc.rect(20, y, 60, 8, 'F');
    doc.rect(80, y, 25, 8, 'F');
    doc.rect(105, y, 25, 8, 'F');
    doc.rect(130, y, 25, 8, 'F');
    doc.rect(155, y, 25, 8, 'F');
    doc.text('Disciplina', 22, y + 5.5);
    doc.text('1o Trim.', 82, y + 5.5);
    doc.text('2o Trim.', 107, y + 5.5);
    doc.text('3o Trim.', 132, y + 5.5);
    doc.text('Media', 157, y + 5.5);
    doc.setTextColor(0, 0, 0);
    y += 8;
    if (data.notas) {
      data.notas.forEach((n, i) => {
        if (i % 2 === 0) { doc.setFillColor(248, 250, 252); doc.rect(20, y, 160, 7, 'F'); }
        doc.text(n.disciplina || '-', 22, y + 5);
        doc.text(String(n.t1 || '-'), 87, y + 5);
        doc.text(String(n.t2 || '-'), 112, y + 5);
        doc.text(String(n.t3 || '-'), 137, y + 5);
        const media = n.t1 && n.t2 && n.t3 ? ((n.t1 + n.t2 + n.t3) / 3).toFixed(1) : '-';
        doc.text(String(media), 162, y + 5);
        y += 7;
      });
    }
  }
  doc.save(`${type}_${data.nome?.replace(/\s/g, '_') || 'doc'}.pdf`);
  showToast('Documento gerado com sucesso!');
}

// ==================== CHECK FIRST RUN ====================
function isFirstRun() {
  return !DB.data.users || DB.data.users.length === 0;
}

function hasDirector() {
  return DB.data.users.some(u => u.perfil === 'director');
}

// ==================== RENDER ENGINE ====================
// Track if we've checked Firebase initially
let initialSyncDone = false;

function render() {
  const app = document.getElementById('app');
  
  // Show loading state on first load if online and hasn't synced yet
  if (!initialSyncDone && navigator.onLine && isFirstRun() && !hasDirector()) {
    app.innerHTML = `
      <div class="login-bg flex items-center justify-center p-4" style="min-height:100vh">
        <div class="glass rounded-2xl p-8 w-full max-w-md text-white text-center">
          <div class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-sync fa-spin text-4xl"></i>
          </div>
          <h1 class="text-xl font-bold">Complexo Escolar Nkalambata</h1>
          <p class="text-blue-200 mt-4">Verificando dados no servidor...</p>
          <p class="text-xs text-blue-300 mt-2">Por favor aguarde</p>
        </div>
      </div>
    `;
    
    // Check Firebase for existing data
    checkFirebaseAndRender();
    return;
  }
  
  if (isFirstRun() && !hasDirector()) {
    app.innerHTML = renderSetupPage();
    bindSetupEvents();
  } else if (!currentUser) {
    app.innerHTML = renderLoginPage();
    bindLoginEvents();
  } else {
    app.innerHTML = renderMainApp();
    bindMainEvents();
  }
}

// Check if there's data in Firebase before showing setup page
async function checkFirebaseAndRender() {
  try {
    if (navigator.onLine) {
      const result = await DB.loadFromFirebase();
      if (result && result.loaded) {
        console.log('📥 Dados encontrados no Firebase!');
      }
    }
  } catch (e) {
    console.log('Erro ao verificar Firebase:', e);
  }
  
  initialSyncDone = true;
  render();
}

function bindSetupEvents() {
  let setupPhotoData = null;
  document.getElementById('setupPhotoInput')?.addEventListener('change', async (e) => {
    if (e.target.files[0]) {
      setupPhotoData = await readFileAsDataURL(e.target.files[0]);
      document.getElementById('setupPhoto').innerHTML = `<img src="${setupPhotoData}" alt="">`;
    }
  });
  document.getElementById('btnSetup')?.addEventListener('click', async () => {
    const btn = document.getElementById('btnSetup');
    const nome = document.getElementById('s_nome').value.trim();
    const bi = document.getElementById('s_bi').value.trim();
    const username = document.getElementById('s_username').value.trim();
    const password = document.getElementById('s_password').value;
    const password2 = document.getElementById('s_password2').value;
    
    if (!nome || !bi || !username || !password) return showToast('Preencha todos os campos obrigatorios!', 'error');
    if (password !== password2) return showToast('As senhas nao coincidem!', 'error');
    if (password.length < 6) return showToast('A senha deve ter no minimo 6 caracteres!', 'error');
    
    // Disable button during save
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Registando e sincronizando...';
    
    const user = {
      id: DB.generateId(),
      nome, bi,
      dataNascimento: document.getElementById('s_dataNasc').value,
      genero: document.getElementById('s_genero').value,
      estadoCivil: document.getElementById('s_estadoCivil').value,
      naturalidade: document.getElementById('s_naturalidade').value,
      provincia: document.getElementById('s_provincia').value,
      municipio: document.getElementById('s_municipio').value,
      telefone: document.getElementById('s_telefone').value,
      email: document.getElementById('s_email').value,
      habilitacoes: document.getElementById('s_habilitacoes').value,
      areaFormacao: document.getElementById('s_areaFormacao').value,
      numAgente: document.getElementById('s_numAgente').value,
      iban: document.getElementById('s_iban').value,
      endereco: document.getElementById('s_endereco').value,
      username, password,
      perfil: 'director',
      foto: setupPhotoData,
      dataCriacao: new Date().toISOString(),
      ativo: true
    };
    
    DB.data.users.push(user);
    
    // Save and sync
    try {
      await DB.save();
      showToast('Director Geral registado com sucesso! Dados sincronizados.');
      
      // Start real-time sync
      if (navigator.onLine) {
        DB.startListener();
      }
      
      render();
    } catch (e) {
      showToast('Erro ao guardar. Os dados foram salvos localmente.', 'warning');
      render();
    }
  });
}

function bindLoginEvents() {
  document.getElementById('btnLogin')?.addEventListener('click', doLogin);
  document.getElementById('loginPass')?.addEventListener('keypress', (e) => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('loginUser')?.addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('loginPass')?.focus(); });
  
  // Sync button on login page
  document.getElementById('btnLoginSync')?.addEventListener('click', async () => {
    const btn = document.getElementById('btnLoginSync');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-sync fa-spin"></i> Sincronizando...';
    btn.disabled = true;
    
    try {
      await DB.forceSync();
      btn.innerHTML = '<i class="fas fa-check"></i> Sincronizado!';
      showToast('Dados sincronizados do servidor!', 'success');
      setTimeout(() => render(), 1000);
    } catch (e) {
      btn.innerHTML = '<i class="fas fa-times"></i> Erro';
      showToast('Erro ao sincronizar!', 'error');
      setTimeout(() => { btn.innerHTML = originalText; btn.disabled = false; }, 2000);
    }
  });
  
  // Click on sync status
  document.getElementById('loginSyncStatus')?.addEventListener('click', async () => {
    if (!navigator.onLine) {
      showToast('Sem conexão à internet!', 'warning');
      return;
    }
    const el = document.getElementById('loginSyncStatus');
    el.innerHTML = '<i class="fas fa-sync fa-spin text-blue-300"></i> <span class="text-xs text-blue-300">Sincronizando...</span>';
    
    try {
      await DB.forceSync();
      showToast('Dados sincronizados!', 'success');
      render();
    } catch (e) {
      showToast('Erro ao sincronizar!', 'error');
      render();
    }
  });
}

function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const user = DB.data.users.find(u => u.username === username && u.password === password && u.ativo);
  if (!user) return showToast('Credenciais invalidas ou conta inactiva!', 'error');
  currentUser = user;
  currentPage = 'dashboard';
  showToast(`Bem-vindo(a), ${user.nome}!`);
  render();
}

    case 'notas': return renderNotas();
    case 'pautas': return renderPautas();
    case 'presencas': return renderPresencas();

  }
}

// ==================== DASHBOARD ====================
function renderDashboard() {
  const totalAlunos = DB.data.students.length;

  const totalTurmas = DB.data.turmas.length;
  const totalClasses = DB.data.classes.length;

  const p = currentUser.perfil;
  let extra = '';

    const minhasDisciplinas = DB.data.disciplinas.filter(d => d.professorId === currentUser.id);
    extra = `<div class="card mt-6"><h3 class="font-bold text-gray-800 mb-4"><i class="fas fa-book mr-2"></i>Minhas Disciplinas</h3>

        const turma = DB.data.turmas.find(t => t.id === d.turmaId);
        return `<div class="bg-blue-50 rounded-lg p-4"><p class="font-semibold text-blue-800">${d.nome}</p><p class="text-sm text-blue-600">${turma?.nome || ''}</p></div>`;
      }).join('')}</div>`}</div>`;

    const meusFilhos = DB.data.students.filter(s => s.encarregadoId === currentUser.id);
    extra = `<div class="card mt-6"><h3 class="font-bold text-gray-800 mb-4"><i class="fas fa-child mr-2"></i>Meus Educandos</h3>
      ${meusFilhos.length === 0 ? '<p class="text-gray-500">Nenhum educando registado.</p>' :

        const turma = DB.data.turmas.find(t => t.id === a.turmaId);

          ${photoOrInitials(a.foto, a.nome)}

    <div class="stat-card" style="--from:#1e3a5f;--to:#2d5a8e">

      <div class="flex justify-between items-start">

    </div>
    <div class="stat-card" style="--from:#d97706;--to:#f59e0b">
      <div class="flex justify-between items-start">
        <div><p class="text-yellow-200 text-sm">Ano Lectivo</p><p class="text-xl font-bold mt-1">${DB.data.anoLetivo?.nome || 'N/D'}</p><p class="text-sm mt-1">${anoAtivo}</p></div>

      </div>
      <div class="mt-6">

          <div class="bg-gray-50 rounded-lg p-3">

      <div class="space-y-3">

          const remetente = DB.data.users.find(u => u.id === m.de);
          return `<div class="bg-gray-50 rounded-lg p-3 ${!m.lida ? 'border-l-4 border-blue-500' : ''}">
            <p class="font-semibold text-sm text-gray-800">${m.assunto}</p>

          </div>`;
        }).join('')}
        ${DB.data.mensagens.filter(m => m.para === currentUser.id).length === 0 ? '<p class="text-gray-400 text-sm">Nenhuma mensagem.</p>' : ''}

}

        const remetente = DB.data.users.find(u => u.id === m.de);
        return `<div class="border-b py-3 px-2 flex items-start gap-3 cursor-pointer hover:bg-gray-50 ${!m.lida ? 'bg-blue-50' : ''}" onclick="lerMensagem('${m.id}')">

        const dest = DB.data.users.find(u => u.id === m.para);
        return `<div class="border-b py-3 px-2 flex items-start gap-3">
          ${photoOrInitials(dest?.foto, dest?.nome || (m.paraTodos ? 'Todos' : m.paraPerfil ? getPerfilLabel(m.paraPerfil) : '?'))}

          </div>
        </div>`;
      }).join('')}

  </div>`;
}

// ==================== FINANCEIRO ====================
function renderFinanceiro() {
  // Ensure financeiro object exists
  if (!DB.data.financeiro) {
    DB.data.financeiro = { entradas: [], saidas: [], patrimonio: [], categorias: ['Propinas', 'Matrículas', 'Multas', 'Doações', 'Outros'], categoriasSaida: ['Salários', 'Material Didáctico', 'Manutenção', 'Serviços', 'Equipamentos', 'Outros'] };
  }
  
  const entradas = DB.data.financeiro.entradas || [];
  const saidas = DB.data.financeiro.saidas || [];
  const patrimonio = DB.data.financeiro.patrimonio || [];
  
  const totalEntradas = entradas.reduce((sum, e) => sum + (parseFloat(e.valor) || 0), 0);
  const totalSaidas = saidas.reduce((sum, s) => sum + (parseFloat(s.valor) || 0), 0);
  const saldo = totalEntradas - totalSaidas;
  const totalPatrimonio = patrimonio.reduce((sum, p) => sum + (parseFloat(p.valor) || 0), 0);
  
  // Get current month data
  const now = new Date();
  const currentMonth = now.getMonth();
  const currentYear = now.getFullYear();
  const entradasMes = entradas.filter(e => { const d = new Date(e.data); return d.getMonth() === currentMonth && d.getFullYear() === currentYear; }).reduce((sum, e) => sum + (parseFloat(e.valor) || 0), 0);
  const saidasMes = saidas.filter(s => { const d = new Date(s.data); return d.getMonth() === currentMonth && d.getFullYear() === currentYear; }).reduce((sum, s) => sum + (parseFloat(s.valor) || 0), 0);

  return `<div class="space-y-6">
    <!-- Summary Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="stat-card" style="--from:#059669;--to:#10b981">

          <div>
            <p class="text-green-200 text-sm">Total Entradas</p>
            <p class="text-2xl font-bold mt-1">${totalEntradas.toLocaleString('pt-AO')} Kz</p>
            <p class="text-xs text-green-200 mt-2">Este mês: ${entradasMes.toLocaleString('pt-AO')} Kz</p>
          </div>
          <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
            <i class="fas fa-arrow-down text-xl"></i>
          </div>
        </div>
      </div>
      <div class="stat-card" style="--from:#dc2626;--to:#ef4444">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-red-200 text-sm">Total Saídas</p>
            <p class="text-2xl font-bold mt-1">${totalSaidas.toLocaleString('pt-AO')} Kz</p>
            <p class="text-xs text-red-200 mt-2">Este mês: ${saidasMes.toLocaleString('pt-AO')} Kz</p>
          </div>
          <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
            <i class="fas fa-arrow-up text-xl"></i>
          </div>
        </div>
      </div>
      <div class="stat-card" style="--from:${saldo >= 0 ? '#2563eb' : '#dc2626'};--to:${saldo >= 0 ? '#60a5fa' : '#f87171'}">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-blue-200 text-sm">Saldo Actual</p>
            <p class="text-2xl font-bold mt-1">${saldo.toLocaleString('pt-AO')} Kz</p>
            <p class="text-xs text-blue-200 mt-2">${saldo >= 0 ? 'Positivo' : 'Negativo'}</p>
          </div>
          <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
            <i class="fas fa-wallet text-xl"></i>
          </div>
        </div>
      </div>
      <div class="stat-card" style="--from:#7c3aed;--to:#a78bfa">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-purple-200 text-sm">Património</p>
            <p class="text-2xl font-bold mt-1">${totalPatrimonio.toLocaleString('pt-AO')} Kz</p>
            <p class="text-xs text-purple-200 mt-2">${patrimonio.length} itens registados</p>
          </div>
          <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
            <i class="fas fa-building text-xl"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="card">
      <div class="flex flex-wrap gap-3 mb-6">
        <button class="btn-success" onclick="openFinanceModal('entrada')"><i class="fas fa-plus mr-2"></i>Nova Entrada</button>
        <button class="btn-danger" onclick="openFinanceModal('saida')"><i class="fas fa-minus mr-2"></i>Nova Saída</button>
        <button class="btn-info" onclick="openFinanceModal('patrimonio')"><i class="fas fa-box mr-2"></i>Registar Património</button>
        <button class="btn-warning" onclick="exportFinanceiroXLS()"><i class="fas fa-file-excel mr-2"></i>Exportar Excel</button>
        <button class="btn-primary" onclick="exportFinanceiroPDF()"><i class="fas fa-file-pdf mr-2"></i>Relatório PDF</button>
      </div>

      <!-- Tabs -->
      <div class="flex border-b mb-4">
        <button class="tab-btn active" onclick="showFinanceTab('entradas', this)">Entradas (${entradas.length})</button>

window.showFinanceTab = (tab, btn) => {
  document.querySelectorAll('.finance-tab').forEach(t => t.style.display = 'none');

// Open finance modal

// Save finance entry
window.saveFinanceEntry = (type, id) => {
  const data = document.getElementById('fin_data')?.value;
  const valor = parseFloat(document.getElementById('fin_valor')?.value) || 0;
  const descricao = document.getElementById('fin_descricao')?.value?.trim();
  
  if (!descricao) return showToast('Preencha a descrição!', 'error');
  if (type !== 'patrimonio' && valor <= 0) return showToast('Valor inválido!', 'error');
  
  // Ensure financeiro structure exists
  if (!DB.data.financeiro) DB.data.financeiro = { entradas: [], saidas: [], patrimonio: [] };
  if (!DB.data.financeiro.entradas) DB.data.financeiro.entradas = [];
  if (!DB.data.financeiro.saidas) DB.data.financeiro.saidas = [];
  if (!DB.data.financeiro.patrimonio) DB.data.financeiro.patrimonio = [];
  
  if (type === 'entrada') {
    const entry = {
      id: id || DB.generateId(),
      data: data,
      valor: valor,
      descricao: descricao,
      categoria: document.getElementById('fin_categoria')?.value,
      alunoId: document.getElementById('fin_aluno')?.value,
      pagador: document.getElementById('fin_pagador')?.value,
      recibo: document.getElementById('fin_recibo')?.value,
      observacoes: document.getElementById('fin_obs')?.value,
      criadoPor: currentUser?.id,
      criadoEm: new Date().toISOString()
    };
    
    if (id) {
      const idx = DB.data.financeiro.entradas.findIndex(e => e.id === id);
      if (idx >= 0) DB.data.financeiro.entradas[idx] = entry;
    } else {
      DB.data.financeiro.entradas.push(entry);
    }
  } else if (type === 'saida') {
    const entry = {
      id: id || DB.generateId(),
      data: data,
      valor: valor,
      descricao: descricao,
      categoria: document.getElementById('fin_categoria')?.value,
      beneficiario: document.getElementById('fin_beneficiario')?.value,
      factura: document.getElementById('fin_factura')?.value,
      metodo: document.getElementById('fin_metodo')?.value,
      observacoes: document.getElementById('fin_obs')?.value,
      criadoPor: currentUser?.id,
      criadoEm: new Date().toISOString()
    };
    
    if (id) {
      const idx = DB.data.financeiro.saidas.findIndex(s => s.id === id);
      if (idx >= 0) DB.data.financeiro.saidas[idx] = entry;
    } else {
      DB.data.financeiro.saidas.push(entry);
    }
  } else if (type === 'patrimonio') {
    const entry = {
      id: id || DB.generateId(),
      codigo: document.getElementById('fin_codigo')?.value,
      dataAquisicao: data,
      descricao: descricao,
      categoria: document.getElementById('fin_categoria')?.value,
      valor: valor,
      localizacao: document.getElementById('fin_localizacao')?.value,
      estado: document.getElementById('fin_estado')?.value,
      quantidade: parseInt(document.getElementById('fin_quantidade')?.value) || 1,
      fornecedor: document.getElementById('fin_fornecedor')?.value,
      observacoes: document.getElementById('fin_obs')?.value,
      criadoPor: currentUser?.id,
      criadoEm: new Date().toISOString()
    };
    
    if (id) {
      const idx = DB.data.financeiro.patrimonio.findIndex(p => p.id === id);
      if (idx >= 0) DB.data.financeiro.patrimonio[idx] = entry;
    } else {
      DB.data.financeiro.patrimonio.push(entry);
    }
  }
  
  DB.save();
  closeModal();
  render();
  showToast(id ? 'Registo actualizado!' : 'Registo adicionado!');
};

// Edit finance entry
window.editFinanceEntry = (type, id) => {
  openFinanceModal(type, id);
};

// Delete finance entry
window.deleteFinanceEntry = (type, id) => {
  if (!confirm('Tem certeza que deseja eliminar este registo?')) return;
  
  if (type === 'entrada') {
    DB.data.financeiro.entradas = DB.data.financeiro.entradas.filter(e => e.id !== id);
  } else if (type === 'saida') {
    DB.data.financeiro.saidas = DB.data.financeiro.saidas.filter(s => s.id !== id);
  } else if (type === 'patrimonio') {
    DB.data.financeiro.patrimonio = DB.data.financeiro.patrimonio.filter(p => p.id !== id);
  }
  
  DB.save();
  render();
  showToast('Registo eliminado!');
};

// Export financeiro to XLS
window.exportFinanceiroXLS = () => {
  const wb = XLSX.utils.book_new();
  
  // Entradas
  if (DB.data.financeiro?.entradas?.length) {
    const wsEntradas = XLSX.utils.json_to_sheet(DB.data.financeiro.entradas.map(e => ({
      Data: e.data, Descrição: e.descricao, Categoria: e.categoria, Valor: e.valor, Recibo: e.recibo, Pagador: e.pagador
    })));
    XLSX.utils.book_append_sheet(wb, wsEntradas, 'Entradas');
  }
  
  // Saídas
  if (DB.data.financeiro?.saidas?.length) {
    const wsSaidas = XLSX.utils.json_to_sheet(DB.data.financeiro.saidas.map(s => ({
      Data: s.data, Descrição: s.descricao, Categoria: s.categoria, Valor: s.valor, Beneficiário: s.beneficiario, Factura: s.factura
    })));
    XLSX.utils.book_append_sheet(wb, wsSaidas, 'Saídas');
  }
  
  // Património
  if (DB.data.financeiro?.patrimonio?.length) {
    const wsPatrimonio = XLSX.utils.json_to_sheet(DB.data.financeiro.patrimonio.map(p => ({
      Código: p.codigo, Descrição: p.descricao, Categoria: p.categoria, Valor: p.valor, Localização: p.localizacao, Estado: p.estado
    })));
    XLSX.utils.book_append_sheet(wb, wsPatrimonio, 'Património');
  }
  
  XLSX.writeFile(wb, 'Financeiro_Nkalambata.xlsx');
  showToast('Ficheiro exportado!');
};

// Export financeiro to PDF
window.exportFinanceiroPDF = () => {
  const entradas = DB.data.financeiro?.entradas || [];
  const saidas = DB.data.financeiro?.saidas || [];
  const totalEntradas = entradas.reduce((sum, e) => sum + (parseFloat(e.valor) || 0), 0);
  const totalSaidas = saidas.reduce((sum, s) => sum + (parseFloat(s.valor) || 0), 0);
  
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  
  doc.setFontSize(16);
  doc.text('COMPLEXO ESCOLAR NKALAMBATA', 105, 15, { align: 'center' });
  doc.setFontSize(12);
  doc.text('Relatório Financeiro', 105, 25, { align: 'center' });
  doc.setFontSize(10);
  doc.text(`Data: ${new Date().toLocaleDateString('pt-AO')}`, 20, 35);
  
  let y = 50;
  doc.setFontSize(11);
  doc.text('RESUMO:', 20, y);
  y += 10;
  doc.text(`Total de Entradas: ${totalEntradas.toLocaleString('pt-AO')} Kz`, 30, y);
  y += 7;
  doc.text(`Total de Saídas: ${totalSaidas.toLocaleString('pt-AO')} Kz`, 30, y);
  y += 7;
  doc.text(`Saldo: ${(totalEntradas - totalSaidas).toLocaleString('pt-AO')} Kz`, 30, y);
  
  doc.save('Relatorio_Financeiro_Nkalambata.pdf');
  showToast('Relatório gerado!');
};

// ==================== MODAL SYSTEM ====================
function showModal(title, content, size = '800px') {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `<div class="modal fade-in" style="max-width:${size}">
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-lg font-bold text-gray-800">${title}</h3>
      <button class="text-gray-400 hover:text-gray-600 text-2xl" onclick="closeModal()">&times;</button>
    </div>
    <div>${content}</div>
  </div>`;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
}

function closeModal() {
  document.getElementById('modalOverlay')?.remove();
}

  document.getElementById('btnSalvarUsuarioModal')?.addEventListener('click', () => {

    const password = document.getElementById('m_password').value;
    if (!nome || !bi || !username) return showToast('Preencha os campos obrigatorios!', 'error');
    if (!user && !password) return showToast('Defina uma senha!', 'error');

    const userData = {

      dataNascimento: document.getElementById('m_dataNasc').value,

      DB.data.users.push(userData);
      showToast('Usuario cadastrado com sucesso!');

    DB.save();
    closeModal();
    render();
  });
}

window.carregarAlunosNota = () => {
  const discId = document.getElementById('notaDisciplina')?.value;
  const trimestre = parseInt(document.getElementById('notaTrimestre')?.value) || 1;
  if (!discId) return;
  const disc = DB.data.disciplinas.find(d => d.id === discId);
  if (!disc) return;
  const alunos = DB.data.students.filter(s => s.turmaId === disc.turmaId);
  const container = document.getElementById('notasContainer');
  if (alunos.length === 0) { container.innerHTML = '<p class="text-gray-400 text-center py-4">Nenhum aluno nesta turma.</p>'; return; }
  container.innerHTML = `
    <table><thead><tr><th>No</th><th>Aluno</th><th>MAC</th><th>PP</th><th>PT</th><th>Media Trim.</th></tr></thead><tbody>
      ${alunos.map((a, i) => {
        const nota = DB.data.notas.find(n => n.alunoId === a.id && n.disciplinaId === discId && n.trimestre === trimestre);
        return `<tr>
          <td>${i + 1}</td>
          <td class="font-semibold">${a.nome}</td>
          <td><input type="number" min="0" max="20" class="!w-16 !p-1 text-center nota-input" data-aluno="${a.id}" data-field="mac" value="${nota?.mac || ''}"></td>
          <td><input type="number" min="0" max="20" class="!w-16 !p-1 text-center nota-input" data-aluno="${a.id}" data-field="pp" value="${nota?.pp || ''}"></td>
          <td><input type="number" min="0" max="20" class="!w-16 !p-1 text-center nota-input" data-aluno="${a.id}" data-field="pt" value="${nota?.pt || ''}"></td>
          <td class="font-bold media-cell" id="media_${a.id}">${nota ? ((parseFloat(nota.mac||0) + parseFloat(nota.pp||0) + parseFloat(nota.pt||0)) / 3).toFixed(1) : '-'}</td>
        </tr>`;
      }).join('')}
    </tbody></table>
    <button class="btn-success mt-4" id="btnSalvarNotas"><i class="fas fa-save mr-2"></i>Salvar Notas</button>
  `;

  // Calculate media on input change
  container.querySelectorAll('.nota-input').forEach(input => {
    input.addEventListener('input', () => {
      const alunoId = input.dataset.aluno;
      const row = input.closest('tr');
      const inputs = row.querySelectorAll('.nota-input');
      const vals = Array.from(inputs).map(i => parseFloat(i.value) || 0);
      const media = vals.reduce((a, b) => a + b, 0) / 3;
      document.getElementById(`media_${alunoId}`).textContent = media.toFixed(1);
    });
  });

  document.getElementById('btnSalvarNotas')?.addEventListener('click', () => {
    const rows = container.querySelectorAll('tbody tr');
    rows.forEach(row => {
      const inputs = row.querySelectorAll('.nota-input');
      const alunoId = inputs[0]?.dataset.aluno;
      if (!alunoId) return;
      const mac = parseFloat(inputs[0].value) || null;
      const pp = parseFloat(inputs[1].value) || null;
      const pt = parseFloat(inputs[2].value) || null;
      let nota = DB.data.notas.find(n => n.alunoId === alunoId && n.disciplinaId === discId && n.trimestre === trimestre);
      if (nota) { nota.mac = mac; nota.pp = pp; nota.pt = pt; }
      else { DB.data.notas.push({ id: DB.generateId(), alunoId, disciplinaId: discId, trimestre, mac, pp, pt, data: new Date().toISOString() }); }
    });
    DB.save();
    showToast('Notas salvas com sucesso!');
  });
};

// Pauta
window.carregarPauta = () => {
  const classeId = document.getElementById('pautaClasse')?.value;
  const turmaId = document.getElementById('pautaTurma')?.value;
  if (!classeId) return;
  let alunos = DB.data.students.filter(s => s.classeId === classeId);
  if (turmaId) alunos = alunos.filter(s => s.turmaId === turmaId);
  const disciplinas = DB.data.disciplinas.filter(d => d.classeId === classeId && (!turmaId || d.turmaId === turmaId));
  const container = document.getElementById('pautaContainer');
  container.innerHTML = `
    <div class="overflow-x-auto">
    <table><thead><tr><th>No</th><th>Aluno</th>${disciplinas.map(d => `<th>${d.nome.substring(0, 8)}</th>`).join('')}<th>Media Geral</th><th>Resultado</th></tr></thead><tbody>
      ${alunos.map((a, i) => {
        let somaMedias = 0; let countMedias = 0;
        const tds = disciplinas.map(d => {
          const notasDisc = DB.data.notas.filter(n => n.alunoId === a.id && n.disciplinaId === d.id);
          let mediaFinal = '-';
          if (notasDisc.length > 0) {
            const t1 = notasDisc.find(n => n.trimestre === 1);
            const t2 = notasDisc.find(n => n.trimestre === 2);
            const t3 = notasDisc.find(n => n.trimestre === 3);
            const m1 = t1 ? (t1.mac + t1.pp + t1.pt) / 3 : null;
            const m2 = t2 ? (t2.mac + t2.pp + t2.pt) / 3 : null;
            const m3 = t3 ? (t3.mac + t3.pp + t3.pt) / 3 : null;
            const medias = [m1, m2, m3].filter(m => m !== null);
            if (medias.length > 0) { mediaFinal = (medias.reduce((a,b) => a+b) / medias.length).toFixed(1); somaMedias += parseFloat(mediaFinal); countMedias++; }
          }
          return `<td class="${parseFloat(mediaFinal) < 10 ? 'text-red-600 font-bold' : ''}">${mediaFinal}</td>`;
        }).join('');
        const mediaGeral = countMedias > 0 ? (somaMedias / countMedias).toFixed(1) : '-';
        const resultado = parseFloat(mediaGeral) >= 10 ? '<span class="badge badge-success">Aprovado</span>' : mediaGeral !== '-' ? '<span class="badge badge-danger">Reprovado</span>' : '-';
        return `<tr><td>${i+1}</td><td class="font-semibold">${a.nome}</td>${tds}<td class="font-bold">${mediaGeral}</td><td>${resultado}</td></tr>`;
      }).join('')}
    </tbody></table></div>
  `;
};

window.gerarDocFinal = (tipo) => {
  const alunoId = document.getElementById('doc_aluno')?.value;
  if (!alunoId) return showToast('Selecione um aluno!', 'warning');
  const aluno = DB.data.students.find(s => s.id === alunoId);
  const classe = DB.data.classes.find(c => c.id === aluno.classeId);
  const turma = DB.data.turmas.find(t => t.id === aluno.turmaId);

  const data = {
    nome: aluno.nome,
    bi: aluno.bi,
    dataNascimento: formatDate(aluno.dataNascimento),
    naturalidade: aluno.naturalidade,
    provincia: aluno.provincia,
    classe: classe?.nome,
    turma: turma?.nome,
    nivel: classe?.nivel,
    notas: []
  };

  if (tipo === 'boletim') {
    const disciplinas = DB.data.disciplinas.filter(d => d.turmaId === aluno.turmaId);
    data.notas = disciplinas.map(d => {
      const n1 = DB.data.notas.find(n => n.alunoId === alunoId && n.disciplinaId === d.id && n.trimestre === 1);
      const n2 = DB.data.notas.find(n => n.alunoId === alunoId && n.disciplinaId === d.id && n.trimestre === 2);
      const n3 = DB.data.notas.find(n => n.alunoId === alunoId && n.disciplinaId === d.id && n.trimestre === 3);
      return {
        disciplina: d.nome,
        t1: n1 ? ((n1.mac + n1.pp + n1.pt) / 3).toFixed(1) : null,
        t2: n2 ? ((n2.mac + n2.pp + n2.pt) / 3).toFixed(1) : null,
        t3: n3 ? ((n3.mac + n3.pp + n3.pt) / 3).toFixed(1) : null,
      };
    });
  }
  generateDocument(tipo, data);
};

// Backup
window.fazerBackup = () => {
  const backupData = {
    ...DB.data,
    backupDate: new Date().toISOString(),
    backupVersion: '2.0'
  };
  const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
  saveAs(blob, `backup_nkalambata_${new Date().toISOString().split('T')[0]}.json`);
  showToast('Backup realizado com sucesso!');
};

window.restaurarBackup = async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  
  if (!confirm('ATENÇÃO: Restaurar um backup irá substituir TODOS os dados actuais. Deseja continuar?')) {
    event.target.value = '';
    return;
  }
  
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const backupData = JSON.parse(e.target.result);
      
      // Validate backup structure
      if (!backupData.users || !Array.isArray(backupData.users)) {
        throw new Error('Estrutura de backup inválida');
      }
      
      DB.data = backupData;
      DB.initData();
      DB.saveLocal();
      
      // Sync to Firebase immediately
      if (navigator.onLine) {
        DB.showStatus('loading', 'Enviando backup para o servidor...');
        await DB.saveToFirebase();
        DB.showStatus('success', 'Backup restaurado e sincronizado!');
      }
      
      showToast('Backup restaurado com sucesso!');
      currentUser = null;
      render();
    } catch(err) { 
      console.error('Restore error:', err);
      showToast('Ficheiro de backup inválido!', 'error'); 
    }
  };
  reader.readAsText(file);
  event.target.value = '';
};

// Force full sync from backup page
window.forceFullSync = async () => {
  if (!navigator.onLine) {
    showToast('Sem conexão à internet!', 'warning');
    return;
  }
  
  showToast('Iniciando sincronização completa...', 'info');
  
  try {
    const result = await DB.forceSync();
    if (result) {
      render();
      showToast('Sincronização completa com sucesso!', 'success');
    }
  } catch (e) {
    showToast('Erro na sincronização: ' + e.message, 'error');
  }
};

      const assunto = document.getElementById('msg_assunto').value.trim();
      const corpo = document.getElementById('msg_corpo').value.trim();
      if (!assunto || !corpo) return showToast('Preencha assunto e mensagem!', 'error');
      const msg = { id: DB.generateId(), de: currentUser.id, assunto, corpo, data: new Date().toISOString(), lida: false };
      if (tipo === 'individual') {
        const userId = document.getElementById('msg_user').value;
        if (!userId) return showToast('Selecione um destinatario!', 'error');
        msg.para = userId;
        DB.data.mensagens.push(msg);
      } else if (tipo === 'perfil') {
        msg.paraPerfil = document.getElementById('msg_perfil').value;
        DB.data.mensagens.push(msg);
      } else {
        msg.paraTodos = true;
        DB.data.mensagens.push(msg);
      }
      DB.save(); closeModal(); render(); showToast('Mensagem enviada com sucesso!');
    });
  });

  // Novo Evento
  document.getElementById('btnNovoEvento')?.addEventListener('click', () => {
    showModal('Novo Evento / Aviso', `
      <div class="space-y-4">
        <div><label class="text-sm font-semibold">Titulo *</label><input id="ev_titulo" placeholder="Titulo do evento"></div>
        <div><label class="text-sm font-semibold">Tipo</label><select id="ev_tipo"><option value="info">Informacao</option><option value="aviso">Aviso</option><option value="urgente">Urgente</option></select></div>
        <div><label class="text-sm font-semibold">Data</label><input id="ev_data" type="date" value="${new Date().toISOString().split('T')[0]}"></div>
        <div><label class="text-sm font-semibold">Descricao</label><textarea id="ev_desc" rows="4" placeholder="Descricao do evento..."></textarea></div>
        <button class="btn-primary" id="btnSalvarEvento"><i class="fas fa-save mr-2"></i>Publicar</button>
      </div>
    `, '500px');
    document.getElementById('btnSalvarEvento')?.addEventListener('click', () => {
      const titulo = document.getElementById('ev_titulo').value.trim();
      if (!titulo) return showToast('Defina o titulo!', 'error');
      DB.data.eventos.push({
        id: DB.generateId(),
        titulo,
        tipo: document.getElementById('ev_tipo').value,
        data: document.getElementById('ev_data').value,
        descricao: document.getElementById('ev_desc').value,
        criadoPor: currentUser.id
      });
      DB.save(); closeModal(); render(); showToast('Evento publicado!');
    });
  });

  // Configuracoes
  document.getElementById('btnSalvarConfig')?.addEventListener('click', () => {
    DB.data.config = DB.data.config || {};
    DB.data.config.telefone = document.getElementById('cfgTelefone').value;
    DB.data.config.email = document.getElementById('cfgEmail').value;
    DB.data.config.endereco = document.getElementById('cfgEndereco').value;
    DB.save(); showToast('Configuracoes salvas!');
  });
  document.getElementById('btnAlterarSenha')?.addEventListener('click', () => {
    const nova = document.getElementById('novaSenha').value;
    const conf = document.getElementById('confSenha').value;
    if (!nova || nova.length < 6) return showToast('Senha deve ter minimo 6 caracteres!', 'error');
    if (nova !== conf) return showToast('Senhas nao coincidem!', 'error');
    const u = DB.data.users.find(x => x.id === currentUser.id);
    if (u) { u.password = nova; currentUser.password = nova; DB.save(); showToast('Senha alterada com sucesso!'); }
  });

  // Horarios - Add Aula
  document.getElementById('btnAddHorario')?.addEventListener('click', () => {
    const turmaId = document.getElementById('horarioTurma')?.value;
    if (!turmaId) return showToast('Selecione uma turma!', 'warning');
    const discs = DB.data.disciplinas.filter(d => d.turmaId === turmaId);
    showModal('Adicionar Aula ao Horario', `
      <div class="grid grid-cols-2 gap-4">
        <div><label class="text-sm font-semibold">Dia da Semana</label><select id="h_dia"><option>Segunda</option><option>Terca</option><option>Quarta</option><option>Quinta</option><option>Sexta</option></select></div>
        <div><label class="text-sm font-semibold">Hora</label><input id="h_hora" type="time" value="07:30"></div>
        <div><label class="text-sm font-semibold">Disciplina</label><select id="h_disc"><option value="">Selecione</option>${discs.map(d => `<option value="${d.id}">${d.nome}</option>`).join('')}</select></div>
        <div><label class="text-sm font-semibold">Duracao (min)</label><input id="h_dur" type="number" value="45"></div>
      </div>
      <button class="btn-primary mt-4" onclick="salvarHorarioAula('${turmaId}')"><i class="fas fa-save mr-2"></i>Adicionar</button>
    `, '400px');
  });
}

window.salvarHorarioAula = (turmaId) => {
  const dia = document.getElementById('h_dia').value;
  const hora = document.getElementById('h_hora').value;
  const discId = document.getElementById('h_disc').value;
  const duracao = document.getElementById('h_dur').value;
  if (!discId) return showToast('Selecione uma disciplina!', 'error');
  DB.data.horarios.push({ id: DB.generateId(), turmaId, dia, hora, disciplinaId: discId, duracao });
  DB.save(); closeModal(); render(); showToast('Aula adicionada ao horario!');
};

window.carregarHorario = () => {
  const turmaId = document.getElementById('horarioTurma')?.value;
  if (!turmaId) return;
  const horarios = DB.data.horarios.filter(h => h.turmaId === turmaId);
  const dias = ['Segunda', 'Terca', 'Quarta', 'Quinta', 'Sexta'];
  const horas = [...new Set(horarios.map(h => h.hora))].sort();
  const container = document.getElementById('horarioContainer');
  if (horas.length === 0) { container.innerHTML = '<p class="text-gray-400 text-center py-8">Nenhuma aula no horario desta turma.</p>'; return; }
  container.innerHTML = `<div class="overflow-x-auto"><table><thead><tr><th>Hora</th>${dias.map(d => `<th>${d}</th>`).join('')}</tr></thead><tbody>
    ${horas.map(hora => `<tr><td class="font-semibold">${hora}</td>${dias.map(dia => {
      const aula = horarios.find(h => h.hora === hora && h.dia === dia);
      const disc = aula ? DB.data.disciplinas.find(d => d.id === aula.disciplinaId) : null;
      return `<td class="${disc ? 'bg-blue-50' : ''}">${disc ? `<span class="text-xs font-semibold text-blue-700">${disc.nome}</span>` : '-'}</td>`;
    }).join('')}</tr>`).join('')}
  </tbody></table></div>`;
};

// ==================== INITIAL RENDER ====================
render();

// Force sync button handler
window.forceSync = async () => {
  const result = await DB.forceSync();
  if (result) {
    render();
    showToast('Sincronização completa!', 'success');
  }
};

// Add sync status to console for debugging
console.log('🏫 Complexo Escolar Nkalambata - Sistema iniciado');
console.log('📊 Usuários locais:', DB.data.users?.length || 0);
console.log('🌐 Status:', navigator.onLine ? 'Online' : 'Offline');
</script>
</body>
